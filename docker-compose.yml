services:
  postgres:
    image: postgres:16-alpine
    container_name: edutech-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edutech_auth_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    container_name: edutech-auth-service
    restart: always
    ports:
      - '8001:8001'
    environment:
      NODE_ENV: development
      PORT: 8001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/edutech_auth_db?schema=public"
      JWT_SECRET: "your_jwt_secret_key_here"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: edutech-web
    restart: always
    ports:
      - '5173:5173'
    environment:
      VITE_API_AUTH_URL: "http://localhost:8001"
    depends_on:
      - auth-service

volumes:
  postgres_data:
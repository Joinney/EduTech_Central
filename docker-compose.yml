version: "3.8"

services:
  # --- DATABASES ---
  postgres:
    image: postgres:15-alpine
    container_name: edutech-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edutech_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: edutech-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: edutech-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- BACKEND SERVICES ---
  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: edutech-core-api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    container_name: edutech-realtime
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis

  submission-gateway:
    build:
      context: ./services/submission-gateway
      dockerfile: Dockerfile
    container_name: edutech-submission
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - redis

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: edutech-ai
    restart: always
    ports:
      - "8000:8000"

  # --- FRONTEND ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: edutech-web
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - core-api

volumes:
  postgres_data:
  mongo_data:
  redis_data:


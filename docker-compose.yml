services:
  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    container_name: edutech-auth-service
    restart: always
    ports:
      - '8001:8001'
    env_file:
      - backend/services/auth-service/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: edutech-web
    restart: always
    ports:
      - '5173:5173'
    environment:
      VITE_API_AUTH_URL: "http://localhost:8001/api/v1"
    depends_on:
      - auth-service

volumes:
  postgres_data: